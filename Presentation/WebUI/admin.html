<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopClean Admin - Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#195de6',
                        'background-light': '#f6f6f8',
                        'background-dark': '#111621',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">
    <header
        class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-primary/10 p-2 rounded-xl">
                    <span class="material-symbols-outlined text-primary text-2xl">grid_view</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Admin Dashboard</h1>
            </div>
            <nav class="flex gap-8 items-center">
                <a href="products.html"
                    class="text-slate-500 dark:text-slate-400 hover:text-primary transition-colors font-semibold text-sm uppercase tracking-wider">Storefront</a>
                <a href="admin.html" class="text-primary font-black text-sm uppercase tracking-wider">Management</a>
                <button onclick="sendMessage('LOGOUT', null)"
                    class="text-slate-500 dark:text-slate-400 hover:text-red-500 transition-colors font-semibold text-sm uppercase tracking-wider flex items-center gap-1">
                    <span class="material-symbols-outlined text-[20px]">logout</span>
                    Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 w-full flex-grow">
        <!-- Dashboard Header & Switcher -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <div>
                <h2 id="dash-title" class="text-4xl font-black text-slate-900 dark:text-white tracking-tight">Product
                    Inventory</h2>
                <div class="flex items-center gap-2 mt-3 text-slate-500">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                    <p class="text-sm font-medium">Live connection to Database</p>
                </div>
            </div>
            <div class="flex gap-4">
                <div
                    class="bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl flex gap-1 border border-slate-200 dark:border-slate-800">
                    <button id="tab-products" onclick="switchTab('products')"
                        class="px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all bg-white dark:bg-slate-800 shadow-sm text-primary">Products</button>
                    <button id="tab-categories" onclick="switchTab('categories')"
                        class="px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all text-slate-400 hover:text-slate-600">Categories</button>
                </div>
                <button id="add-btn" onclick="addNew()"
                    class="bg-primary text-white font-black px-8 py-4 rounded-2xl hover:bg-blue-700 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-3 shadow-xl shadow-blue-500/30 text-sm uppercase tracking-widest">
                    <span class="material-symbols-outlined text-xl">add</span>
                    <span id="add-btn-text">CREATE PRODUCT</span>
                </button>
            </div>
        </div>

        <!-- Products Section -->
        <div id="section-products"
            class="bg-white dark:bg-slate-800 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                            <th class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                                Inventory Item</th>
                            <th
                                class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 text-center">
                                Category</th>
                            <th class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Price
                            </th>
                            <th
                                class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 text-right">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list" class="divide-y divide-slate-100 dark:divide-slate-700">
                        <!-- Items populated by JS -->
                    </tbody>
                </table>
            </div>
            <div
                class="bg-slate-50 dark:bg-slate-900/50 px-8 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <span id="product-count"
                    class="text-xs font-bold text-slate-400 uppercase tracking-widest">Loading...</span>
            </div>
        </div>

        <!-- Categories Section -->
        <div id="section-categories"
            class="hidden bg-white dark:bg-slate-800 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                            <th class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                                Category Name</th>
                            <th class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                                Description</th>
                            <th
                                class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 text-center">
                                Product Count</th>
                            <th
                                class="px-8 py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 text-right">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-category-list" class="divide-y divide-slate-100 dark:divide-slate-700">
                        <!-- Items populated by JS -->
                    </tbody>
                </table>
            </div>
            <div
                class="bg-slate-50 dark:bg-slate-900/50 px-8 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <span id="category-count"
                    class="text-xs font-bold text-slate-400 uppercase tracking-widest">Loading...</span>
            </div>
        </div>
    </main>

    <script>
        let currentTab = 'products';

        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        window.onMessageReceived = function (response) {
            if (response.Type === "RECEIVE_ALL_PRODUCTS") {
                renderAdminTable(response.Data);
            } else if (response.Type === "RECEIVE_ALL_CATEGORIES") {
                renderCategoryTable(response.Data);
            } else if (response.Type === "PRODUCT_DELETED") {
                sendMessage("GET_ALL_PRODUCTS", null);
            } else if (response.Type === "CATEGORY_DELETED") {
                sendMessage("GET_ALL_CATEGORIES", null);
            } else if (response.Type === "ERROR") {
                console.error("Backend Error:", response.Data.Message);
                alert(response.Data.Message);
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            const isProd = tab === 'products';

            // Toggle Views
            document.getElementById('section-products').classList.toggle('hidden', !isProd);
            document.getElementById('section-categories').classList.toggle('hidden', isProd);

            // Update Buttons
            document.getElementById('tab-products').className = isProd
                ? 'px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all bg-white dark:bg-slate-800 shadow-sm text-primary'
                : 'px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all text-slate-400 hover:text-slate-600';

            document.getElementById('tab-categories').className = !isProd
                ? 'px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all bg-white dark:bg-slate-800 shadow-sm text-primary'
                : 'px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all text-slate-400 hover:text-slate-600';

            // Update Header
            document.getElementById('dash-title').innerText = isProd ? "Product Inventory" : "Category Management";
            document.getElementById('add-btn-text').innerText = isProd ? "CREATE PRODUCT" : "CREATE CATEGORY";

            // Fetch Data
            if (isProd) sendMessage("GET_ALL_PRODUCTS", null);
            else sendMessage("GET_ALL_CATEGORIES", null);
        }

        function addNew() {
            if (currentTab === 'products') window.location.href = 'admin-product-form.html';
            else window.location.href = 'admin-category-form.html';
        }

        function renderAdminTable(products) {
            const tbody = document.getElementById('admin-product-list');
            const countLabel = document.getElementById('product-count');

            if (!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-8 py-24 text-center text-slate-400 font-medium">Your inventory is empty. Start by adding new products.</td></tr>';
                countLabel.innerText = "0 PRODUCTS FOUND";
                return;
            }

            countLabel.innerText = `${products.length} PRODUCTS FOUND`;
            tbody.innerHTML = products.map(p => `
                <tr class="hover:bg-primary/[0.02] dark:hover:bg-primary/[0.05] transition-all duration-300 group">
                    <td class="px-8 py-5">
                        <div class="flex items-center gap-5">
                            <div class="h-16 w-16 rounded-2xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-700 overflow-hidden shadow-sm group-hover:shadow-md transition-shadow">
                                <img src="${p.ImageUrl || 'https://via.placeholder.com/60'}" alt="${p.ProductName}" class="h-full w-full object-cover">
                            </div>
                            <div class="flex flex-col">
                                <span class="font-black text-slate-900 dark:text-white capitalize text-base group-hover:text-primary transition-colors">${p.ProductName}</span>
                                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest mt-1">PRODUCT#${p.Id.toString().padStart(4, '0')}</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-5 text-center">
                        <span class="inline-block px-4 py-1.5 bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 text-[9px] font-black rounded-full uppercase tracking-widest border border-slate-200 dark:border-slate-700">
                            ${p.CategoryName || 'General'}
                        </span>
                    </td>
                    <td class="px-8 py-5">
                        <span class="font-black text-slate-900 dark:text-white text-lg">$${(p.Price || 0).toFixed(2)}</span>
                    </td>
                    <td class="px-8 py-5 text-right">
                        <div class="flex justify-end gap-3 translate-x-4 opacity-0 group-hover:translate-x-0 group-hover:opacity-100 transition-all duration-300">
                             <button onclick="editProduct(${p.Id})" class="p-3 text-primary hover:bg-primary hover:text-white rounded-xl transition-all shadow-sm">
                                <span class="material-symbols-outlined text-xl">edit_square</span>
                             </button>
                             <button onclick="deleteProduct(${p.Id})" class="p-3 text-slate-400 hover:bg-red-500 hover:text-white rounded-xl transition-all shadow-sm">
                                <span class="material-symbols-outlined text-xl">delete_forever</span>
                             </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderCategoryTable(categories) {
            const tbody = document.getElementById('admin-category-list');
            const countLabel = document.getElementById('category-count');

            if (!categories || categories.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-8 py-24 text-center text-slate-400 font-medium">No categories found.</td></tr>';
                countLabel.innerText = "0 CATEGORIES FOUND";
                return;
            }

            countLabel.innerText = `${categories.length} CATEGORIES FOUND`;
            tbody.innerHTML = categories.map(c => `
                <tr class="hover:bg-primary/[0.02] dark:hover:bg-primary/[0.05] transition-all duration-300 group">
                    <td class="px-8 py-5">
                        <span class="font-black text-slate-900 dark:text-white capitalize text-base group-hover:text-primary transition-colors">${c.CategoryName}</span>
                    </td>
                    <td class="px-8 py-5">
                        <p class="text-sm text-slate-500 line-clamp-1 max-w-xs">${c.Description || 'No description'}</p>
                    </td>
                    <td class="px-8 py-5 text-center">
                        <span class="font-black text-slate-900 dark:text-white text-base">${c.ProductCount}</span>
                    </td>
                    <td class="px-8 py-5 text-right">
                        <div class="flex justify-end gap-3 translate-x-4 opacity-0 group-hover:translate-x-0 group-hover:opacity-100 transition-all duration-300">
                             <button onclick="editCategory(${c.Id})" class="p-3 text-primary hover:bg-primary hover:text-white rounded-xl transition-all shadow-sm">
                                <span class="material-symbols-outlined text-xl">edit_square</span>
                             </button>
                             <button onclick="deleteCategory(${c.Id})" class="p-3 text-slate-400 hover:bg-red-500 hover:text-white rounded-xl transition-all shadow-sm">
                                <span class="material-symbols-outlined text-xl">delete_forever</span>
                             </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function editProduct(id) { window.location.href = `admin-product-form.html?id=${id}`; }
        function deleteProduct(id) {
            if (confirm('Permanently remove this product from inventory?')) sendMessage("DELETE_PRODUCT", id);
        }

        function editCategory(id) { window.location.href = `admin-category-form.html?id=${id}`; }
        function deleteCategory(id) {
            if (confirm('Delete this category? This might affect products linked to it.')) sendMessage("DELETE_CATEGORY", id);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { sendMessage("GET_ALL_PRODUCTS", null); }, 100);
        });
    </script>
</body>

</html>
