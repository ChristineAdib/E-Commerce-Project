<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Registration Page - ShopEase</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#195de6",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                        "neutral-light": "#f0f2f4",
                        "neutral-dark": "#1f2937",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <!-- Navigation -->
    <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-10 py-3 sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-4">
                <div class="size-6 text-primary">
                    <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z">
                        </path>
                    </svg>
                </div>
                <h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">ShopEase
                </h2>
            </div>
            <nav class="hidden md:flex items-center gap-9">
                <a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">Home</a>
                <a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">Products</a>
                <a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">About</a>
                <a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">Contact</a>
            </nav>
        </div>
        <div class="flex flex-1 justify-end gap-4 md:gap-8 items-center">
            <label class="hidden lg:flex flex-col min-w-40 !h-10 max-w-64">
                <div
                    class="flex w-full flex-1 items-stretch rounded-lg h-full group focus-within:ring-2 ring-primary/20 transition-all">
                    <div
                        class="text-slate-400 flex border-none bg-neutral-light dark:bg-neutral-dark items-center justify-center pl-4 rounded-l-lg border-r-0">
                        <span class="material-symbols-outlined text-[20px]">search</span>
                    </div>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border-none bg-neutral-light dark:bg-neutral-dark focus:border-none h-full placeholder:text-slate-400 px-4 rounded-l-none border-l-0 pl-2 text-sm font-normal leading-normal transition-colors"
                        placeholder="Search products..." value="" />
                </div>
            </label>
            <div class="flex gap-3">
                <button
                    class="flex items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-white border border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-700 text-sm font-bold leading-normal transition-colors">
                    <span class="truncate">Sign In</span>
                </button>
                <button
                    class="hidden sm:flex items-center justify-center overflow-hidden rounded-lg h-10 w-10 bg-neutral-light dark:bg-neutral-dark text-slate-900 dark:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <span class="material-symbols-outlined text-[20px]">shopping_cart</span>
                </button>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <main
        class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-background-light dark:bg-background-dark">
        <div
            class="w-full max-w-md space-y-8 bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800">
            <div class="text-center">
                <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Create your account</h1>
                <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Join ShopEase to start shopping for the best
                    deals today.</p>
            </div>
            <form action="#" class="mt-8 space-y-6" onsubmit="register(event)">
                <div class="space-y-5">
                    <!-- Full Name (Username) -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="reg-username">Username</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <span class="material-symbols-outlined text-[20px]">person</span>
                            </div>
                            <input id="reg-username"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                                placeholder="Choose a username" required="" type="text" />
                        </div>
                    </div>
                    <!-- Email Address -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="reg-email">Email Address</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <span class="material-symbols-outlined text-[20px]">mail</span>
                            </div>
                            <input id="reg-email"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                                placeholder="john@example.com" required="" type="email" />
                        </div>
                    </div>
                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="reg-password">Password</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <span class="material-symbols-outlined text-[20px]">lock</span>
                            </div>
                            <input id="reg-password"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                                placeholder="••••••••" required="" type="password" />
                        </div>
                    </div>
                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="reg-confirm">Confirm Password</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <span class="material-symbols-outlined text-[20px]">lock_reset</span>
                            </div>
                            <input id="reg-confirm"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                                placeholder="••••••••" required="" type="password" />
                        </div>
                    </div>
                </div>

                <div id="error-message"
                    class="hidden text-red-500 text-sm font-medium text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg">
                </div>

                <div class="flex items-start mt-6">
                    <div class="flex items-center h-5">
                        <input id="reg-terms"
                            class="h-4 w-4 text-primary focus:ring-primary border-slate-300 rounded cursor-pointer"
                            type="checkbox" required />
                    </div>
                    <div class="ml-3 text-sm">
                        <label class="font-medium text-slate-700 dark:text-slate-300" for="reg-terms">I agree to the <a
                                class="text-primary hover:text-blue-700 dark:hover:text-blue-400 underline decoration-primary/30 underline-offset-2"
                                href="#">Terms and Conditions</a></label>
                    </div>
                </div>
                <div>
                    <button
                        class="group relative flex w-full justify-center rounded-lg bg-primary py-3 px-4 text-sm font-bold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors shadow-lg shadow-primary/30"
                        type="submit">
                        Sign Up
                    </button>
                </div>
            </form>
            <div class="relative mt-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="bg-white dark:bg-slate-900 px-4 text-slate-500 dark:text-slate-400">Or continue
                        with</span>
                </div>
            </div>
            <div class="mt-6 grid grid-cols-2 gap-4">
                <button
                    class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 py-2.5 px-4 text-sm font-medium text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-all"
                    type="button">
                    <svg aria-hidden="true" class="h-5 w-5" viewbox="0 0 24 24">
                        <path class="text-slate-100"
                            d="M12.0003 20.45c-4.67 0-8.4503-3.78-8.4503-8.45 0-4.67 3.7803-8.45 8.4503-8.45 4.67 0 8.4503 3.78 8.4503 8.45 0 4.67-3.7803 8.45-8.4503 8.45z"
                            fill="currentColor"></path>
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4"></path>
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853"></path>
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05"></path>
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335"></path>
                    </svg>
                    Google
                </button>
                <button
                    class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 py-2.5 px-4 text-sm font-medium text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-all"
                    type="button">
                    <svg aria-hidden="true" class="h-5 w-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
                        <path clip-rule="evenodd"
                            d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"
                            fill-rule="evenodd"></path>
                    </svg>
                    Facebook
                </button>
            </div>
            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Already have an account?
                <a class="font-bold text-primary hover:text-blue-700 dark:hover:text-blue-400 transition-colors"
                    href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <script>
        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        function register(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const errorEl = document.getElementById('error-message');

            if (password !== confirm) {
                errorEl.textContent = "Passwords do not match";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            sendMessage("REGISTER", { UserName: username, Email: email, Password: password, IsAdmin: false });
        }

        window.onMessageReceived = function (message) {
            if (message.Type === "ERROR") {
                const errorEl = document.getElementById('error-message');
                errorEl.textContent = message.Data.Message;
                errorEl.classList.remove('hidden');
            }
        };
    </script>

    <!-- Simple Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-slate-500 dark:text-slate-400 text-sm">© 2024 ShopEase, Inc. All rights reserved.</p>
            <div class="flex gap-6 text-sm font-medium text-slate-500 dark:text-slate-400">
                <a class="hover:text-primary transition-colors" href="#">Privacy</a>
                <a class="hover:text-primary transition-colors" href="#">Terms</a>
                <a class="hover:text-primary transition-colors" href="#">Help</a>
            </div>
        </div>
    </footer>
</body>

</html>
