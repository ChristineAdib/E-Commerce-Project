<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopClean - Product Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#195de6',
                        'background-light': '#f6f6f8',
                        'background-dark': '#111621',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">
    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="products.html" class="flex items-center gap-4">
                    <span class="material-symbols-outlined text-primary text-3xl">shopping_bag</span>
                    <h1 class="text-xl font-bold">ShopClean</h1>
                </a>
            </div>
            <nav class="flex gap-6">
                <a href="products.html"
                    class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors font-medium">Products</a>
                <a href="admin.html"
                    class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors font-medium">Admin</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow flex items-center">
        <div id="product-container" class="w-full">
            <!-- Loading Placeholder -->
            <div class="flex flex-col items-center justify-center py-20 text-slate-500">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
                <p>Retrieving product details...</p>
            </div>
        </div>
    </main>

    <script>
        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        window.onMessageReceived = function (response) {
            if (response.Type === "RECEIVE_PRODUCT_DETAILS") {
                renderDetails(response.Data);
            }
        };

        function renderDetails(product) {
            const container = document.getElementById('product-container');
            if (!product) {
                container.innerHTML = '<div class="text-center py-20"><span class="material-symbols-outlined text-6xl text-slate-300 mb-4">error</span><p class="text-xl font-bold">Product not found.</p><a href="products.html" class="text-primary mt-4 inline-block font-medium">Back to Products</a></div>';
                return;
            }

            container.innerHTML = `
                <div class="flex flex-col lg:flex-row gap-16 items-center">
                    <div class="w-full lg:w-1/2">
                        <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] overflow-hidden border border-slate-200 dark:border-slate-700 shadow-2xl relative group">
                            <img src="${product.ImageUrl || 'https://via.placeholder.com/600'}" alt="${product.ProductName}" class="w-full aspect-square object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                        </div>
                    </div>
                    <div class="w-full lg:w-1/2">
                        <div class="mb-10">
                            <nav class="flex gap-2 text-xs font-bold text-slate-400 mb-6 uppercase tracking-[0.2em]">
                                <a href="products.html" class="hover:text-primary transition-colors">Products</a>
                                <span>/</span>
                                <span class="text-primary">${product.CategoryName || 'General'}</span>
                            </nav>
                            <h2 class="text-5xl font-black text-slate-900 dark:text-white leading-[1.1]">${product.ProductName}</h2>
                            <div class="flex items-center gap-3 mt-6">
                                <div class="flex text-yellow-500 bg-yellow-50 dark:bg-yellow-900/20 px-3 py-1.5 rounded-full border border-yellow-200 dark:border-yellow-900/50">
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">star</span>
                                    <span class="text-xs font-bold ml-1 text-yellow-800 dark:text-yellow-400">4.0</span>
                                </div>
                                <span class="text-slate-500 text-xs font-medium">124 Reviews</span>
                            </div>
                        </div>
                        
                        <div class="text-4xl font-black text-primary mb-10 flex items-center gap-2">
                             <span class="text-2xl opacity-50 font-bold">$</span>${product.Price.toFixed(2)}
                        </div>
                        
                        <div class="space-y-6 mb-12">
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed text-lg">
                                ${product.Description || 'No description available for this product.'}
                            </p>
                            <div class="flex items-center gap-3 text-sm font-bold text-slate-400 uppercase tracking-widest bg-slate-100 dark:bg-slate-800/50 px-4 py-2 rounded-xl w-fit">
                                <span class="material-symbols-outlined text-primary">inventory_2</span>
                                <span>Stock: ${product.StockQuantity} units available</span>
                            </div>
                            <ul class="grid grid-cols-1 gap-4">
                                <li class="flex items-center gap-3 text-sm">
                                    <span class="material-symbols-outlined text-primary text-xl">check_circle</span>
                                    <span class="font-medium">Premium build quality</span>
                                </li>
                                <li class="flex items-center gap-3 text-sm">
                                    <span class="material-symbols-outlined text-primary text-xl">check_circle</span>
                                    <span class="font-medium">Certified by industry experts</span>
                                </li>
                            </ul>
                        </div>
                        
                        <div class="flex flex-wrap gap-4">
                            <button class="bg-primary text-white font-black px-10 py-5 rounded-[1.25rem] hover:bg-blue-700 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-2xl shadow-blue-500/40 flex items-center justify-center gap-3 text-sm uppercase tracking-widest">
                                <span class="material-symbols-outlined">shopping_basket</span>
                                ADD TO CART
                            </button>
                            <button class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-6 py-5 rounded-[1.25rem] hover:bg-slate-50 dark:hover:bg-slate-700 transition-all text-slate-400 hover:text-red-500">
                                <span class="material-symbols-outlined">favorite</span>
                            </button>
                        </div>
                        
                        <div class="mt-16 flex items-center gap-8 border-t border-slate-200 dark:border-slate-800 pt-10">
                            <div class="flex items-center gap-4">
                                <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-full">
                                    <span class="material-symbols-outlined text-primary">local_shipping</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-sm font-bold">Free Shipping</span>
                                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-tight">On orders over $100</span>
                                </div>
                            </div>
                             <div class="flex items-center gap-4">
                                <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-full">
                                    <span class="material-symbols-outlined text-primary">security</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-sm font-bold">Secure Purchase</span>
                                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-tight">SSL encrypted payment</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                setTimeout(() => {
                    sendMessage("GET_PRODUCT_DETAILS", parseInt(id));
                }, 100);
            } else {
                document.getElementById('product-container').innerHTML = '<div class="text-center py-20"><p>No product ID found in the URL. Go back to <a href="products.html" class="text-primary underline">products</a>.</p></div>';
            }
        });
    </script>
</body>

</html>
