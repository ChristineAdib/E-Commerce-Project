<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopClean Admin - Product Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#195de6',
                        'background-light': '#f6f6f8',
                        'background-dark': '#111621',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">
    <header
        class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-primary/10 p-2 rounded-xl">
                    <span class="material-symbols-outlined text-primary text-2xl">inventory_2</span>
                </div>
                <h1 id="form-title" class="text-xl font-bold tracking-tight">Add New Product</h1>
            </div>
            <nav class="flex gap-8 items-center">
                <a href="admin.html"
                    class="text-slate-500 dark:text-slate-400 hover:text-primary transition-colors font-semibold text-sm uppercase tracking-wider">Back
                    to List</a>
                <button onclick="sendMessage('LOGOUT', null)"
                    class="text-slate-500 dark:text-slate-400 hover:text-red-500 transition-colors font-semibold text-sm uppercase tracking-wider flex items-center gap-1">
                    <span class="material-symbols-outlined text-[20px]">logout</span>
                    Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12 w-full flex-grow">
        <div
            class="bg-white dark:bg-slate-800 rounded-[2.5rem] border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden p-8 md:p-12">
            <form id="product-form" class="space-y-8">
                <input type="hidden" id="productId" name="Id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Basic Info -->
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <label for="ProductName"
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Product
                                Name</label>
                            <input type="text" id="ProductName" name="ProductName" required
                                placeholder="Enter product name..."
                                class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none">
                        </div>

                        <div class="space-y-2">
                            <label for="Price"
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Price
                                (USD)</label>
                            <div class="relative">
                                <span class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
                                <input type="number" id="Price" name="Price" required step="0.01" min="0"
                                    placeholder="0.00"
                                    class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl pl-10 pr-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label for="CategoryID"
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Category</label>
                            <div class="relative">
                                <select id="CategoryID" name="CategoryID" required
                                    class="w-full appearance-none bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none">
                                    <option value="" disabled selected>Loading Categories...</option>
                                </select>
                                <span
                                    class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label for="stockQuantity"
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Stock
                                Quantity</label>
                            <input type="number" id="stockQuantity" name="StockQuantity" required min="0"
                                placeholder="0"
                                class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none">
                        </div>
                    </div>

                    <!-- Image Section -->
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <!-- Existing Image URL Section -->
                            <label for="ImageUrl"
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Image
                                URL / Path</label>
                            <div class="flex gap-2">
                                <input type="text" id="ImageUrl" name="ImageUrl" placeholder="images/example.jpg"
                                    class="flex-1 bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none">
                                <button type="button" onclick="sendMessage('PICK_IMAGE', null)"
                                    class="bg-slate-100 dark:bg-slate-700 hover:bg-primary hover:text-white text-slate-600 dark:text-slate-300 px-4 rounded-2xl transition-all flex items-center gap-2">
                                    <span class="material-symbols-outlined">upload_file</span>
                                    <span class="text-[10px] font-black uppercase">Choose</span>
                                </button>
                            </div>
                        </div>

                        <div class="pt-2">
                            <div class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 ml-1">
                                Preview</div>
                            <div
                                class="aspect-square bg-slate-100 dark:bg-slate-900 rounded-[2rem] border-4 border-slate-50 dark:border-slate-800 shadow-inner flex items-center justify-center overflow-hidden">
                                <img id="imagePreview" src="" class="w-full h-full object-cover hidden">
                                <div id="imagePlaceholder" class="flex flex-col items-center gap-2 text-slate-300">
                                    <span class="material-symbols-outlined text-4xl">image</span>
                                    <span class="text-[10px] font-black uppercase tracking-widest">No Image</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="description"
                        class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Product
                        Description</label>
                    <textarea id="description" name="Description" required rows="4"
                        placeholder="Provide a detailed description of the product..."
                        class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none resize-none"></textarea>
                </div>

                <div class="flex flex-col md:flex-row gap-4 pt-8 border-t border-slate-100 dark:border-slate-700">
                    <button type="submit"
                        class="flex-1 bg-primary text-white font-black px-8 py-5 rounded-[1.25rem] hover:bg-blue-700 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-2xl shadow-blue-500/30 text-sm uppercase tracking-widest">
                        <span class="material-symbols-outlined">save</span>
                        <span id="submit-text">Create Product</span>
                    </button>
                    <button type="button" onclick="window.location.href='admin.html'"
                        class="px-8 py-5 border-2 border-slate-100 dark:border-slate-700 rounded-[1.25rem] text-slate-400 font-black text-sm uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-900 transition-all">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('product-form');
        const imageUrlInput = document.getElementById('ImageUrl');
        const imagePreview = document.getElementById('imagePreview');
        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const formTitle = document.getElementById('form-title');
        const submitText = document.getElementById('submit-text');

        let isEditMode = false;

        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        window.onMessageReceived = function (response) {
            if (response.Type === "RECEIVE_PRODUCT_DETAILS") {
                // Store product temporarily if categories aren't loaded yet
                window.pendingProduct = response.Data;
                populateForm(response.Data);
            } else if (response.Type === "RECEIVE_IMAGE_PATH") {
                imageUrlInput.value = response.Data.Path;
                updateImagePreview(response.Data.Path);
            } else if (response.Type === "PRODUCT_CREATED" || response.Type === "PRODUCT_UPDATED") {
                window.location.href = 'admin.html';
            } else if (response.Type === "ERROR") {
                alert("Error: " + response.Data.Message);
            }
        };

        function populateForm(product) {
            if (!product || !window.categoriesLoaded) return;
            document.getElementById('productId').value = product.Id;
            document.getElementById('ProductName').value = product.ProductName;
            document.getElementById('Price').value = product.Price;
            document.getElementById('ImageUrl').value = product.ImageUrl;
            document.getElementById('stockQuantity').value = product.StockQuantity || 0;
            document.getElementById('description').value = product.Description || '';
            document.getElementById('CategoryID').value = product.CategoryID || '';

            updateImagePreview(product.ImageUrl);
        }

        function updateImagePreview(url) {
            if (url) {
                imagePreview.src = url;
                imagePreview.classList.remove('hidden');
                imagePlaceholder.classList.add('hidden');
            } else {
                imagePreview.src = '';
                imagePreview.classList.add('hidden');
                imagePlaceholder.classList.remove('hidden');
            }
        }

        window.receiveCategories = function (categories) {
            const select = document.getElementById("CategoryID");
            select.innerHTML = '<option value="" disabled selected>Select Category</option>';
            categories.forEach(c => {
                const option = document.createElement("option");
                option.value = c.id;
                option.textContent = c.name;
                select.appendChild(option);
            });
            window.categoriesLoaded = true;
            if (window.pendingProduct) {
                populateForm(window.pendingProduct);
            }
        };

        imageUrlInput.addEventListener('input', (e) => {
            updateImagePreview(e.target.value);
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = {
                ProductName: formData.get('ProductName'),
                Price: parseFloat(formData.get('Price')),
                ImageUrl: formData.get('ImageUrl'),
                CategoryID: parseInt(formData.get('CategoryID')),
                Description: formData.get('Description'),
                StockQuantity: parseInt(formData.get('StockQuantity'))
            };

            if (isEditMode) {
                data.Id = parseInt(formData.get('Id'));
                sendMessage("UPDATE_PRODUCT", data);
            } else {
                sendMessage("CREATE_PRODUCT", data);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                isEditMode = true;
                formTitle.innerText = "Edit Product";
                submitText.innerText = "Update Product";
                setTimeout(() => {
                    sendMessage("GET_PRODUCT_DETAILS", parseInt(id));
                }, 100);
            }
            window.chrome.webview.postMessage({ type: "GET_ALL_CATEGORIES" });
        });
    </script>
</body>

</html>
