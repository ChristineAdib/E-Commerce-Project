<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shopping Cart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#195de6",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light text-slate-900 font-display antialiased">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <header class="sticky top-0 z-10 w-full border-b border-slate-200 bg-white/95 backdrop-blur-sm">
            <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
                <div class="flex items-center gap-8">
                    <a class="flex items-center gap-2 text-slate-900 font-bold text-xl" href="products.html">
                        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white">
                            <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
                        </div>
                        <h2>ShopEasy</h2>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="sendMessage('LOGOUT', null)"
                        class="text-slate-600 hover:text-red-500 transition-colors font-medium flex items-center gap-1">
                        <span class="material-symbols-outlined text-[20px]">logout</span>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                    <a href="cart.html"
                        class="relative flex h-10 w-10 items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                        <span class="material-symbols-outlined">shopping_cart</span>
                        <span id="cart-badge"
                            class="absolute top-2 right-2 h-2 w-2 rounded-full bg-red-500 ring-2 ring-white hidden"></span>
                    </a>
                </div>
            </div>
        </header>
        <main class="flex-grow py-8 bg-background-light">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col gap-2 mb-8">
                    <h1 class="text-3xl font-black tracking-tight text-slate-900 sm:text-4xl">Your Shopping Cart</h1>
                    <p id="cart-count-text" class="text-slate-500">Loading your cart...</p>
                </div>
                <div class="lg:grid lg:grid-cols-12 lg:gap-8">
                    <div class="lg:col-span-8">
                        <div id="cart-items-container"
                            class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                            <!-- Items populated by JS -->
                        </div>
                        <div class="mt-6">
                            <a href="products.html"
                                class="flex items-center gap-2 text-sm font-medium text-primary hover:underline">
                                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                                Continue Shopping
                            </a>
                        </div>
                    </div>
                    <div class="lg:col-span-4 mt-8 lg:mt-0">
                        <div class="sticky top-24 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
                            <h2 class="text-lg font-bold text-slate-900 mb-6">Order Summary</h2>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between text-sm">
                                    <p class="text-slate-500">Subtotal</p>
                                    <p id="summary-subtotal" class="font-medium text-slate-900">$0.00</p>
                                </div>
                                <div class="flex items-center justify-between text-sm">
                                    <p class="text-slate-500">Shipping</p>
                                    <p class="font-medium text-green-600">FREE</p>
                                </div>
                                <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between">
                                    <p class="text-base font-bold text-slate-900">Order Total</p>
                                    <p id="summary-total" class="text-xl font-bold text-primary">$0.00</p>
                                </div>
                            </div>
                            <button onclick="proceedToCheckout()"
                                class="mt-8 flex w-full items-center justify-center rounded-lg bg-primary px-6 py-3 text-base font-bold text-white shadow-sm hover:bg-blue-700 transition-all">
                                Proceed to Checkout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        window.onMessageReceived = function (response) {
            if (response.Type === "ERROR") {
                showToast(response.Data.Message, "error");
            }
        };

        function showToast(message, type = "success") {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-8 right-8 px-6 py-4 rounded-2xl shadow-2xl transition-all transform translate-y-20 z-[100] font-bold text-sm ${type === 'error' ? 'bg-red-500 text-white' : 'bg-green-600 text-white'
                }`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-20'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-20');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        window.receiveCart = function (cart) {
            const container = document.getElementById('cart-items-container');
            const countText = document.getElementById('cart-count-text');
            const badge = document.getElementById('cart-badge');
            const subtotalEl = document.getElementById('summary-subtotal');
            const totalEl = document.getElementById('summary-total');

            if (cart.totalQuantity > 0) {
                badge.textContent = cart.totalQuantity;
                badge.classList.remove('hidden');
                countText.textContent = `You have ${cart.totalQuantity} items in your cart.`;
            } else {
                badge.classList.add('hidden');
                countText.textContent = 'Your cart is empty.';
            }

            subtotalEl.textContent = `$${(cart.totalPrice || 0).toFixed(2)}`;
            totalEl.textContent = `$${(cart.totalPrice || 0).toFixed(2)}`;

            if (!cart.items || cart.items.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-500">Cart is empty.</div>`;
                return;
            }

            container.innerHTML = cart.items.map(item => `
                <div class="flex gap-6 p-6 border-b border-slate-100 last:border-0">
                    <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" class="h-24 w-24 rounded-lg object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h3 class="font-bold">${item.name}</h3>
                            <p class="font-bold">$${item.price.toFixed(2)}</p>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <div class="flex items-center border rounded-lg">
                                <button onclick="updateQty(${item.productId}, ${item.quantity - 1})" class="px-2 py-1">-</button>
                                <span class="px-3 text-sm">${item.quantity}</span>
                                <button onclick="updateQty(${item.productId}, ${item.quantity + 1})" class="px-2 py-1">+</button>
                            </div>
                            <button onclick="removeItem(${item.productId})" class="text-sm text-red-500 hover:underline">Remove</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateQty(id, qty) { sendMessage("UPDATE_CART_ITEM", { productId: id, quantity: qty }); }
        function removeItem(id) { sendMessage("REMOVE_FROM_CART", { productId: id }); }

        function proceedToCheckout() {
            const countText = document.getElementById('cart-count-text').textContent;
            if (countText.includes('empty')) {
                showToast("Your cart is empty!", "error");
                return;
            }
            window.location.href = "checkout.html";
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { sendMessage("GET_CART", null); }, 100);
        });
    </script>
</body>

</html>
