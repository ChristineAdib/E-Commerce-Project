<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopClean Admin - Category Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#195de6',
                        'background-light': '#f6f6f8',
                        'background-dark': '#111621',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">
    <header
        class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-primary/10 p-2 rounded-xl">
                    <span class="material-symbols-outlined text-primary text-2xl">category</span>
                </div>
                <h1 id="form-title" class="text-xl font-bold tracking-tight">Add New Category</h1>
            </div>
            <nav class="flex gap-8 items-center">
                <a href="admin.html"
                    class="text-slate-500 dark:text-slate-400 hover:text-primary transition-colors font-semibold text-sm uppercase tracking-wider">Back
                    to List</a>
                <button onclick="sendMessage('LOGOUT', null)"
                    class="text-slate-500 dark:text-slate-400 hover:text-red-500 transition-colors font-semibold text-sm uppercase tracking-wider flex items-center gap-1">
                    <span class="material-symbols-outlined text-[20px]">logout</span>
                    Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12 w-full flex-grow">
        <div
            class="bg-white dark:bg-slate-800 rounded-[2.5rem] border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden p-8 md:p-12">
            <form id="category-form" class="space-y-8">
                <input type="hidden" id="categoryId" name="Id">

                <div class="space-y-6">
                    <div class="space-y-2">
                        <label for="CategoryName"
                            class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Category
                            Name</label>
                        <input type="text" id="CategoryName" name="CategoryName" required
                            placeholder="Enter category name..."
                            class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none">
                    </div>

                    <div class="space-y-2">
                        <label for="Description"
                            class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">Description</label>
                        <textarea id="Description" name="Description" required rows="4"
                            placeholder="Provide a brief description..."
                            class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-6 py-4 text-sm font-bold focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none resize-none"></textarea>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4 pt-8 border-t border-slate-100 dark:border-slate-700">
                    <button type="submit"
                        class="flex-1 bg-primary text-white font-black px-8 py-5 rounded-[1.25rem] hover:bg-blue-700 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-2xl shadow-blue-500/30 text-sm uppercase tracking-widest">
                        <span class="material-symbols-outlined">save</span>
                        <span id="submit-text">Create Category</span>
                    </button>
                    <button type="button" onclick="window.location.href='admin.html'"
                        class="px-8 py-5 border-2 border-slate-100 dark:border-slate-700 rounded-[1.25rem] text-slate-400 font-black text-sm uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-900 transition-all">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('category-form');
        const formTitle = document.getElementById('form-title');
        const submitText = document.getElementById('submit-text');

        let isEditMode = false;

        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        window.onMessageReceived = function (response) {
            if (response.Type === "RECEIVE_CATEGORY_DETAILS") {
                populateForm(response.Data);
            } else if (response.Type === "CATEGORY_CREATED" || response.Type === "CATEGORY_UPDATED") {
                window.location.href = 'admin.html';
            } else if (response.Type === "ERROR") {
                alert("Error: " + response.Data.Message);
            }
        };

        function populateForm(category) {
            if (!category) return;
            document.getElementById('categoryId').value = category.Id;
            document.getElementById('CategoryName').value = category.CategoryName;
            document.getElementById('Description').value = category.Description || '';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            if (isEditMode) {
                const data = {
                    Id: parseInt(formData.get('Id')),
                    CategoryName: formData.get('CategoryName'),
                    Description: formData.get('Description')
                };
                sendMessage("UPDATE_CATEGORY", data);
            } else {
                const data = {
                    Name: formData.get('CategoryName'), // Backend expects 'Name' for creation
                    Description: formData.get('Description')
                };
                sendMessage("CREATE_CATEGORY", data);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                isEditMode = true;
                formTitle.innerText = "Edit Category";
                submitText.innerText = "Update Category";
                setTimeout(() => {
                    sendMessage("GET_CATEGORY_DETAILS", parseInt(id));
                }, 100);
            }
        });
    </script>
</body>

</html>
