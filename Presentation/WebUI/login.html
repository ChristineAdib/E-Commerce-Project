<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - ShopModern</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#195de6",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-surface-light dark:bg-slate-900 px-10 py-3 sticky top-0 z-50">
        <div class="flex items-center gap-4 text-slate-900 dark:text-slate-100">
            <div class="size-6 text-primary">
                <svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
                </svg>
            </div>
            <h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">ShopModern
            </h2>
        </div>
        <div class="flex flex-1 justify-end gap-8 hidden md:flex">
            <div class="flex items-center gap-9">
                <a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">Home</a>
                <a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">Shop</a>
                <a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">About</a>
                <a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal transition-colors"
                    href="#">Contact</a>
            </div>
            <div class="flex gap-2">
                <button
                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-sm font-bold leading-normal tracking-[0.015em]">
                    <span class="truncate">Sign Up</span>
                </button>
            </div>
        </div>
        <!-- Mobile Menu Icon -->
        <div class="md:hidden flex items-center">
            <span class="material-symbols-outlined text-slate-900 dark:text-white cursor-pointer">menu</span>
        </div>
    </header>
    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <!-- Login Card -->
        <div
            class="w-full max-w-[480px] bg-surface-light dark:bg-slate-900 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none border border-slate-100 dark:border-slate-800 overflow-hidden">
            <div class="p-8 sm:p-10 flex flex-col gap-6">
                <!-- Title Section -->
                <div class="flex flex-col gap-2 text-center">
                    <h1 class="text-slate-900 dark:text-white text-3xl font-black leading-tight tracking-[-0.033em]">
                        Welcome Back</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal">Please enter your
                        details to sign in.</p>
                </div>
                <!-- Form Fields -->
                <form class="flex flex-col gap-5 mt-2" onsubmit="login(event)">
                    <!-- Email Field -->
                    <label class="flex flex-col gap-2">
                        <span class="text-slate-900 dark:text-slate-200 text-sm font-bold leading-normal">Email
                            (Username)</span>
                        <div class="relative">
                            <input id="login-username"
                                class="form-input flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-12 px-4 text-base font-normal leading-normal placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all"
                                placeholder="Enter your username" type="text" required />
                            <span
                                class="material-symbols-outlined absolute right-3 top-3 text-slate-400 pointer-events-none text-[20px]">person</span>
                        </div>
                    </label>
                    <!-- Password Field -->
                    <label class="flex flex-col gap-2">
                        <span
                            class="text-slate-900 dark:text-slate-200 text-sm font-bold leading-normal">Password</span>
                        <div class="relative flex items-center">
                            <input id="login-password"
                                class="form-input flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-12 px-4 pr-10 text-base font-normal leading-normal placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all"
                                placeholder="Enter your password" type="password" required />
                            <button
                                class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none flex items-center justify-center"
                                type="button" onclick="togglePassword()">
                                <span id="password-toggle-icon"
                                    class="material-symbols-outlined text-[20px]">visibility_off</span>
                            </button>
                        </div>
                    </label>

                    <div id="error-message"
                        class="hidden text-red-500 text-sm font-medium text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg">
                    </div>

                    <!-- Submit Button -->
                    <button
                        class="w-full flex cursor-pointer items-center justify-center rounded-lg h-12 px-4 bg-primary hover:bg-blue-700 dark:hover:bg-blue-600 text-white text-base font-bold leading-normal tracking-[0.015em] shadow-sm shadow-blue-500/20 transition-all mt-2"
                        type="submit">
                        Sign In
                    </button>
                </form>
                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium uppercase tracking-wider">Or
                        continue with</span>
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                </div>
                <!-- Social Login Buttons -->
                <div class="grid grid-cols-2 gap-3">
                    <button
                        class="flex items-center justify-center gap-2 rounded-lg h-10 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"></path>
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"></path>
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05"></path>
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335"></path>
                        </svg>
                        <span class="text-slate-700 dark:text-slate-200 text-sm font-semibold">Google</span>
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 rounded-lg h-10 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.791-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z">
                            </path>
                        </svg>
                        <span class="text-slate-700 dark:text-slate-200 text-sm font-semibold">Facebook</span>
                    </button>
                </div>
            </div>
            <!-- Card Footer -->
            <div
                class="bg-slate-50 dark:bg-slate-800/50 p-4 border-t border-slate-100 dark:border-slate-800 text-center">
                <p class="text-slate-600 dark:text-slate-400 text-sm">
                    Don't have an account?
                    <a class="text-primary hover:text-blue-700 dark:hover:text-blue-400 font-bold transition-colors"
                        href="register.html">Create one now</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        function login(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('error-message');

            errorEl.classList.add('hidden');
            sendMessage("LOGIN", { username, password });
        }

        function togglePassword() {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        window.onMessageReceived = function (message) {
            if (message.Type === "LOGIN_ERROR") {
                const errorEl = document.getElementById('error-message');
                errorEl.textContent = message.Data.Message;
                errorEl.classList.remove('hidden');
            }
        };
    </script>

    <!-- Simple Footer for Context -->
    <footer class="py-6 text-center text-slate-400 dark:text-slate-600 text-sm">
        <p>© 2023 ShopModern Inc. All rights reserved.</p>
        <div class="flex justify-center gap-4 mt-2">
            <a class="hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Privacy Policy</a>
            <a class="hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Terms of Service</a>
        </div>
    </footer>
</body>

</html>
