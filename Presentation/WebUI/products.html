<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopClean - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#195de6',
                        'background-light': '#f6f6f8',
                        'background-dark': '#111621',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100">
    <header
        class="sticky top-0 z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-primary text-3xl">shopping_bag</span>
                <h1 class="text-xl font-bold">ShopClean</h1>
            </div>
            <nav class="flex items-center gap-6">
                <a href="products.html" class="text-primary font-medium">Products</a>

                <a href="orders.html"
                   class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors font-medium">
                    My Orders
                </a>

                <a href="cart.html"
                   class="relative text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span id="cart-badge"
                          class="absolute -top-2 -right-2 bg-primary text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center hidden">
                        0
                    </span>
                </a>

                <button onclick="logout()"
                        class="text-slate-600 dark:text-slate-400 hover:text-red-500 transition-colors font-medium flex items-center gap-1">
                    <span class="material-symbols-outlined text-[20px]">logout</span>
                </button>
            </nav>
        </div>
    </header>

    <script>
        function logout() {
            sendMessage("LOGOUT", null);
        }
    </script>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-3xl font-bold">Our Products</h2>
            <div
                class="flex items-center gap-4 bg-white dark:bg-slate-800 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                <span class="material-symbols-outlined text-slate-400 pl-2">search</span>
                <input type="text" id="search-input" placeholder="Search products..."
                    class="bg-transparent border-none focus:ring-0 text-sm w-48 lg:w-64">
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Loading State -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-500">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </main>

    <script>
        function sendMessage(type, data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ Type: type, Data: data });
            }
        }

        let allProducts = [];

        window.onMessageReceived = function (response) {
            if (response.Type === "RECEIVE_ALL_PRODUCTS") {
                allProducts = response.Data;
                renderProducts(allProducts);
            } else if (response.Type === "RECEIVE_IMAGE_PATH") {
                // Not used here but handled for consistency
            }
        };

        window.receiveCart = function (cart) {
            const badge = document.getElementById('cart-badge');
            if (cart.totalQuantity > 0) {
                badge.textContent = cart.totalQuantity;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        };

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p =>
                p.ProductName.toLowerCase().includes(term) ||
                (p.CategoryName && p.CategoryName.toLowerCase().includes(term))
            );
            renderProducts(filtered);
        });

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500"><span class="material-symbols-outlined text-5xl mb-4">inventory_2</span><p>No products available.</p></div>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-xl transition-all duration-300 group">
                    <div class="aspect-[4/5] bg-slate-100 dark:bg-slate-900 overflow-hidden relative">
                        <img src="${p.ImageUrl || 'https://via.placeholder.com/300'}" alt="${p.ProductName}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/5 group-hover:bg-black/0 transition-colors"></div>
                        <div class="absolute top-4 right-4 transform translate-y-2 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300">
                             <button class="bg-white dark:bg-slate-900 p-2 rounded-full shadow-lg text-slate-400 hover:text-red-500 transition-colors">
                                <span class="material-symbols-outlined">favorite</span>
                             </button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="text-[10px] font-bold text-primary uppercase tracking-widest mb-2">${p.CategoryName || 'General'}</div>
                        <h3 class="font-bold text-lg mb-2 truncate group-hover:text-primary transition-colors">${p.ProductName}</h3>
                        <div class="flex items-center justify-between mt-6">
                            <span class="text-xl font-bold text-slate-900 dark:text-white">$${p.Price ? p.Price.toFixed(2) : '0.00'}</span>
                            <button onclick="viewDetails(${p.Id})" class="bg-primary text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-blue-700 transform active:scale-95 transition-all shadow-lg shadow-blue-500/20">VIEW DETAILS</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewDetails(id) {
            window.location.href = `product-details.html?id=${id}`;
        }

        // Request products on load
        window.addEventListener('DOMContentLoaded', () => {
            // Small delay to ensure WebView2 is ready to receive
            setTimeout(() => {
                sendMessage("GET_ALL_PRODUCTS", null);
                sendMessage("GET_CART", null);
            }, 100);
        });
    </script>
</body>

</html>
